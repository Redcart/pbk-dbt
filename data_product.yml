name: publibike

jobs:

  - name: refresh
    type: dbt_run
    schedule: "*/15 * * * *"
    command: build
    args:
      - "--select"
      - "vault"
      - "marts"
      - "monitoring"

  - name: full_refresh
    type: dbt_run
    schedule: null
    command: build
    args:
      - "--full-refresh"
