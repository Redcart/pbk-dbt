version: 2

sources:
  - name: bronze
    schema: bronze
    description: Raw layer, loaded by pbk-ingest.
    tables:
      - name: publibike_snapshots
        description: One row per PubliBike snapshot (every 5 minutes), full JSON payload.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: { count: 15, period: minute }
            error_after: { count: 1, period: hour }
        columns:
          - name: snapshot_id
            data_tests: [unique, not_null]
          - name: observed_at
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]

      - name: run_googleapis_com_stdout
        description: Cloud Run stdout logs (pbk jobs and functions), written by the Cloud Logging sink. dbt logs are JSON in jsonPayload.
      - name: run_googleapis_com_requests
        description: Cloud Run request logs (the load function), written by the Cloud Logging sink.
      - name: cloudaudit_googleapis_com_system_event
        description: Cloud Run job execution events (completed, failed), written by the Cloud Logging sink.
