name: pbk
version: '1.0.0'
profile: pbk

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - target
  - dbt_packages

# Names as they appear in Cloud Logging (the pipelines monitored through the log sink)
vars:
  cloud_run_functions: ['pbk-ingest-load']
  dbt_job_name: 'pbk-dbt'
  snapshot_interval_minutes: 5  # extract schedule (pbk-ingest), used to count missed snapshots

models:
  pbk:
    staging: { +schema: silver, +materialized: view }
    vault:   { +schema: silver, +materialized: table }
    marts:   { +schema: gold,   +materialized: table }
    monitoring: { +schema: gold, +materialized: table }
