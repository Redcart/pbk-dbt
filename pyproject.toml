[project]
name = "pbk-dbt"
version = "0.1.0"
description = "PBK dbt project: PubliBike silver (Data Vault 2.0) and gold layers on BigQuery"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-bigquery>=1.12,<1.13",
    "mashumaro>=3.17",  # 3.14 breaks on Python 3.14
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]

[tool.ruff]
extend-exclude = ["archive"]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
