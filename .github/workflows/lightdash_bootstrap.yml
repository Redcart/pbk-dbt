name: Lightdash bootstrap

# One-off, per environment: creates the Lightdash project from this dbt project
# (`lightdash deploy --create`). Run it once after Lightdash is up and the personal
# access token is stored in Secret Manager (lightdash-api-key); then copy the project UUID
# from the logs into LIGHTDASH_PROJECT_UUID (pbk-variables). Later deploys run in CD.
#
# Reaches Lightdash through the load balancer + IAP: an ID token of the CI/CD service account
# (audience = the IAP backend service) goes in Proxy-Authorization, the Lightdash token in Authorization.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to create the Lightdash project in'
        required: true
        type: choice
        options: [dev, stg, prd]
        default: dev

env:
  WIF_POOL_ID: ${{ vars.WIF_POOL_ID }}
  WIF_POOL_PROVIDER: ${{ vars.WIF_POOL_PROVIDER }}

jobs:
  create-project:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: ${{ vars.UV_VERSION }}

    - run: make install

    # Application Default Credentials for dbt (oauth) and Secret Manager
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}

    - uses: google-github-actions/setup-gcloud@v3

    # Same service account, ID token for IAP
    - uses: google-github-actions/auth@v3
      id: iap
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        token_format: id_token
        id_token_audience: ${{ vars.LIGHTDASH_IAP_AUDIENCE }}
        id_token_include_email: true
        create_credentials_file: false

    - name: Read the Lightdash token
      run: |
        TOKEN=$(gcloud secrets versions access latest --secret=lightdash-api-key --project=${{ env.GCP_PROJECT_ID }})
        echo "::add-mask::$TOKEN"
        echo "LIGHTDASH_API_KEY=$TOKEN" >> "$GITHUB_ENV"

    # Only the gold models: the Lightdash identity (and this service account) read gold, not silver
    - name: Create the Lightdash project
      env:
        LIGHTDASH_URL: ${{ vars.LIGHTDASH_URL }}
        LIGHTDASH_PROXY_AUTHORIZATION: Bearer ${{ steps.iap.outputs.id_token }}
        GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      run: |
        uv run --no-dev npx --yes @lightdash/cli@3.237.0 deploy --create "pbk ${{ inputs.environment }}" \
          --project-dir . --profiles-dir . --target ${{ inputs.environment }} \
          --select "path:models/marts path:models/monitoring"
