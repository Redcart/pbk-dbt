name: 'Release to production'

on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    permissions:
      contents: 'read'
    uses: ./.github/workflows/reusable_wf.yml
    with:
      uv_version: ${{ vars.UV_VERSION }}

  deploy:
    needs: ci
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/deploy_wf.yml
    with:
      environment: prd
      build: false
      image_tag: ${{ github.ref_name }}
