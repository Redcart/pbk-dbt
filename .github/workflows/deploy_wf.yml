name: Deploy

# image -> (Cloud Run Job || Cloud Schedulers, in parallel).
# dev builds the image; stg and prd use the image dev built for the same commit SHA.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      build:
        required: true
        type: boolean
      image_tag:
        description: 'Extra tag added to the image (release version)'
        required: false
        type: string
        default: ''

env:
  GCP_REGION: ${{ vars.GCP_REGION }}
  WIF_POOL_ID: ${{ vars.WIF_POOL_ID }}
  WIF_POOL_PROVIDER: ${{ vars.WIF_POOL_PROVIDER }}
  PROJECT: ${{ vars.PROJECT }}
  STREAM: ${{ vars.STREAM }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/${{ vars.PROJECT }}-${{ vars.STREAM }}/${{ vars.PROJECT }}-${{ vars.STREAM }}

jobs:
  image:
    # Build and push (dev) or check (stg, prd) the image
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}

    steps:
    - uses: actions/checkout@v7

    - uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        access_token_lifetime: 300s

    - uses: google-github-actions/setup-gcloud@v3

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Build and push
      if: inputs.build
      run: |
        docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
        docker push ${{ env.IMAGE }}:${{ github.sha }}

    # Never rebuild outside dev: the commit must already have an image
    - name: Check image
      if: ${{ !inputs.build }}
      run: gcloud artifacts docker images describe ${{ env.IMAGE }}:${{ github.sha }}

    - name: Tag release
      if: inputs.image_tag != ''
      run: gcloud artifacts docker tags add ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:${{ inputs.image_tag }}

  deploy-job:
    # Cloud Run Job (runs in parallel with deploy-schedulers)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: image
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}
      SERVICE_ACCOUNT_RUNTIME: ${{ vars.SERVICE_ACCOUNT_RUNTIME }}

    steps:
    - uses: actions/checkout@v7

    - uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        access_token_lifetime: 300s

    - uses: google-github-actions/setup-gcloud@v3

    - name: Deploy Cloud Run Job
      run: |
        gcloud run jobs deploy ${{ env.PROJECT }}-${{ env.STREAM }} \
          --image ${{ env.IMAGE }}:${{ github.sha }} \
          --region ${{ env.GCP_REGION }} \
          --memory 1Gi --cpu 1 \
          --task-timeout 600s --max-retries 0 \
          --service-account ${{ env.SERVICE_ACCOUNT_RUNTIME }} \
          --set-env-vars GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}

  deploy-schedulers:
    # Cloud Schedulers (runs in parallel with deploy-job)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: image
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}
      SERVICE_ACCOUNT_RUNTIME: ${{ vars.SERVICE_ACCOUNT_RUNTIME }}

    steps:
    - uses: actions/checkout@v7

    - uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        access_token_lifetime: 300s

    - uses: google-github-actions/setup-gcloud@v3

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: ${{ vars.UV_VERSION }}

    # One scheduler per scheduled job of data_product.yml; the container args select the dbt job
    - name: Deploy Cloud Schedulers
      run: |
        JOB=${{ env.PROJECT }}-${{ env.STREAM }}
        uv run --no-dev python runner.py schedules | while IFS=$'\t' read -r NAME CRON; do
          SCHEDULER=$JOB-$(echo "$NAME" | tr '_' '-')
          # `create` takes --headers, `update` takes --update-headers
          if gcloud scheduler jobs describe $SCHEDULER --location ${{ env.GCP_REGION }} >/dev/null 2>&1; then
            ACTION=update; HEADERS=--update-headers
          else
            ACTION=create; HEADERS=--headers
          fi
          gcloud scheduler jobs $ACTION http $SCHEDULER \
            --location ${{ env.GCP_REGION }} \
            --schedule "$CRON" --time-zone "Etc/UTC" \
            --uri "https://run.googleapis.com/v2/projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/jobs/$JOB:run" \
            --http-method POST \
            $HEADERS "Content-Type=application/json" \
            --message-body "{\"overrides\":{\"containerOverrides\":[{\"args\":[\"$NAME\"]}]}}" \
            --oauth-service-account-email ${{ env.SERVICE_ACCOUNT_RUNTIME }}
        done

  deploy-lightdash:
    # Publish the dbt models to Lightdash (through the load balancer + IAP). Skipped while the
    # environment has no Lightdash project (LIGHTDASH_PROJECT_UUID unset); the check is a step
    # because environment variables are not visible to a job-level `if`.
    # An ID token of the CI/CD service account, audience = the IAP OAuth client ID, goes in
    # Proxy-Authorization; the Lightdash API token in Authorization.
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: image
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}

    steps:
    - name: Lightdash project configured?
      id: gate
      run: echo "run=${{ vars.LIGHTDASH_PROJECT_UUID != '' }}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      if: steps.gate.outputs.run == 'true'

    - uses: astral-sh/setup-uv@v10.3.0
      if: steps.gate.outputs.run == 'true'
      with:
        version: ${{ vars.UV_VERSION }}

    - run: make install
      if: steps.gate.outputs.run == 'true'

    # Application Default Credentials for dbt (oauth) and Secret Manager
    - uses: google-github-actions/auth@v3
      if: steps.gate.outputs.run == 'true'
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}

    - uses: google-github-actions/setup-gcloud@v3
      if: steps.gate.outputs.run == 'true'

    - name: Read the IAP OAuth client ID
      if: steps.gate.outputs.run == 'true'
      id: iap_client
      run: |
        echo "id=$(gcloud secrets versions access latest --secret=lightdash-iap-client-id --project=${{ env.GCP_PROJECT_ID }})" >> "$GITHUB_OUTPUT"

    # Same service account, ID token for IAP
    - uses: google-github-actions/auth@v3
      if: steps.gate.outputs.run == 'true'
      id: iap
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        token_format: id_token
        id_token_audience: ${{ steps.iap_client.outputs.id }}
        id_token_include_email: true
        create_credentials_file: false

    - name: Read the Lightdash token
      if: steps.gate.outputs.run == 'true'
      run: |
        TOKEN=$(gcloud secrets versions access latest --secret=lightdash-api-key --project=${{ env.GCP_PROJECT_ID }})
        echo "::add-mask::$TOKEN"
        echo "LIGHTDASH_API_KEY=$TOKEN" >> "$GITHUB_ENV"

    # Only the gold models: the Lightdash identity (and this service account) read gold, not silver
    - name: Deploy to Lightdash
      if: steps.gate.outputs.run == 'true'
      env:
        LIGHTDASH_URL: ${{ vars.LIGHTDASH_URL }}
        LIGHTDASH_PROJECT: ${{ vars.LIGHTDASH_PROJECT_UUID }}
        LIGHTDASH_PROXY_AUTHORIZATION: Bearer ${{ steps.iap.outputs.id_token }}
      run: |
        uv run --no-dev npx --yes @lightdash/cli@3.237.0 deploy \
          --project-dir . --profiles-dir . --target ${{ inputs.environment }} \
          --select "path:models/marts path:models/monitoring"
