name: 'CD'

# dev: CI + build image + deploy.  stg: CI + deploy the image built on dev (same SHA).
on:
  push:
    branches: ["dev", "stg"]

jobs:
  ci:
    permissions:
      contents: 'read'
    uses: ./.github/workflows/reusable_wf.yml
    with:
      uv_version: ${{ vars.UV_VERSION }}

  deploy:
    needs: ci
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/deploy_wf.yml
    with:
      environment: ${{ github.ref_name }}
      build: ${{ github.ref_name == 'dev' }}
